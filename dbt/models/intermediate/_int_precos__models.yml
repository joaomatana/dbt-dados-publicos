version: 2

models:
  - name: int_precos_municipio_semana
    description: Agregação semanal de preços por região, UF, município, produto, ano, mês e semana.
    columns:
      - name: id
        description: Chave do grão (UF, município, produto, ano, mês, semana).
        data_tests:
          - not_null
          - unique
      - name: preco_medio_venda
        data_tests:
          - positivo
