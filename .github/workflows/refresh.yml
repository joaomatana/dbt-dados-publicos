name: Refresh semanal + docs

on:
  schedule:
    - cron: "0 6 * * 1"  # toda segunda, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache dos CSVs crus (rebaixa só o que mudou)
        uses: actions/cache@v4
        with:
          path: extract/raw
          key: anp-raw-${{ github.run_id }}
          restore-keys: anp-raw-

      - name: Baixa a série recente da ANP
        run: python extract/download_anp.py

      - name: dbt build
        working-directory: dbt
        run: dbt build

      - name: Gera docs estáticos
        working-directory: dbt
        run: dbt docs generate --static

      - name: Prepara o site para o Pages
        run: |
          mkdir -p site
          cp dbt/target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
