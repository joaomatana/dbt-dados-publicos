name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Carrega o fixture (CI determinístico, sem rede)
        run: |
          cp tests/fixtures/anp_amostra.csv extract/raw/
          python extract/download_anp.py --sem-download

      - name: dbt build (models + testes)
        working-directory: dbt
        run: dbt build

      - name: sqlfluff lint
        run: sqlfluff lint dbt/models
